interface:
  display_name: "Quote"
  short_description: "Create, negotiate and request quote proposal PDFs"
dependencies:
  tools:
    - type: "mcp"
      value: "salesforce_headless_mcp"
      description: "Salesforce Headless MCP for quote transactions and document inputs; proposals prefer supported MCP operations with a verified matching local Salesforce session as fallback"
      transport: "streamable_http"
      url: "https://api.salesforce.com/platform/mcp/v1/platform/headless-360"
policy:
  allow_implicit_invocation: true
